    var onMove = function (ev) {
      var dx = (ev.clientX - startX) / state.view.s;
      var dy = (ev.clientY - startY) / state.view.s;
      if (Math.abs(ev.clientX - startX) + Math.abs(ev.clientY - startY) > 3) moved = true;
      node.x = Math.round(originX + dx);
      node.y = Math.round(originY + dy);
      card.el.style.left = node.x + 'px';
      card.el.style.top = node.y + 'px';
      drawEdges();
    };

    var onUp = function () {
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
      window.removeEventListener('pointercancel', onUp);
      card.el.classList.remove('dragging');
      $('#viewport').classList.remove('panning');
      if (moved) persistBoardSoon();
    };

    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onUp);
  }

  /* ------------------------------ 画布平移 / 缩放 ------------------------------ */
  function bindViewport() {
    var vp = $('#viewport');

    // 拖空白平移；点空白取消选中
    vp.addEventListener('pointerdown', function (e) {
      if (e.button !== 0) return;
      if (e.target.closest('.card') || e.target.closest('.empty-state')) return;
      selectNode(null);
      var startX = e.clientX;
      var startY = e.clientY;
      var originX = state.view.x;
      var originY = state.view.y;
      vp.classList.add('panning');
      if (vp.setPointerCapture) {
        try { vp.setPointerCapture(e.pointerId); } catch (err) { /* 忽略 */ }
      }
      var onMove = function (ev) {
        state.view.x = originX + (ev.clientX - startX);
        state.view.y = originY + (ev.clientY - startY);
        applyView();
      };
      var onUp = function () {
        vp.classList.remove('panning');
        vp.removeEventListener('pointermove', onMove);
        vp.removeEventListener('pointerup', onUp);
        vp.removeEventListener('pointercancel', onUp);
      };
      vp.addEventListener('pointermove', onMove);
      vp.addEventListener('pointerup', onUp);
      vp.addEventListener('pointercancel', onUp);
      e.preventDefault();
    });

    // 滚轮缩放，以光标为锚点；textarea 上让内容自己滚
    vp.addEventListener('wheel', function (e) {
      if (e.target.closest('textarea')) return;
      e.preventDefault();
      var rect = vp.getBoundingClientRect();
      var factor = Math.exp(-e.deltaY * 0.0015);
      setZoom(state.view.s * factor, e.clientX - rect.left, e.clientY - rect.top);
    }, { passive: false });
  }

  /* ------------------------------ 节点字段的防抖保存 ------------------------------ */
  function queuePatch(id, patch) {
    if (DEMO) return; // 演示模式只改本地
    var buf = state.patchBuffers.get(id);
    if (!buf) {
      buf = { data: {}, timer: null };
      state.patchBuffers.set(id, buf);
    }
    Object.assign(buf.data, patch);
    if (buf.timer) clearTimeout(buf.timer);
    buf.timer = setTimeout(function () { flushPatch(id); }, 500);
  }

  async function flushPatch(id) {
    var buf = state.patchBuffers.get(id);
    if (!buf) return;
    state.patchBuffers.delete(id);
    if (buf.timer) clearTimeout(buf.timer);
    if (!Object.keys(buf.data).length) return;
    try {
      await api('/api/nodes/' + encodeURIComponent(id), {
        method: 'PATCH',
        body: buf.data
      });
    } catch (err) {
      toast('保存卡片失败：' + err.message, 'error');
    }
  }

  async function flushAllPatches() {
    var ids = Array.from(state.patchBuffers.keys());
    await Promise.all(ids.map(function (id) { return flushPatch(id); }));
  }

  // 拖动结束后持久化整个 board（按契约 PUT /api/board）
  function serializeBoard() {
    return {
      id: state.board.id,
      name: state.board.name,
      nodes: state.board.nodes.map(function (n) {
        return {
          id: n.id, label: n.label, type: n.type, x: n.x, y: n.y,
          model: n.model, fallback: n.fallback, task: n.task, criteria: n.criteria,
          skills: n.skills || [], tools: n.tools || [],
          verify: n.verify || '', verdict: n.verdict || null,
          content: n.content, status: n.status, usage: n.usage, error: n.error
        };
      }),
      edges: state.board.edges.map(function (e) { return { from: e.from, to: e.to }; })
    };
  }

  async function persistBoard() {
    if (DEMO) return;
    try {
      await api('/api/board', { method: 'PUT', body: serializeBoard() });
    } catch (err) {
      toast('保存画布布局失败：' + err.message, 'error');
    }
  }

  function persistBoardSoon() {
    if (DEMO) return;
    if (state.persistTimer) clearTimeout(state.persistTimer);
    state.persistTimer = setTimeout(function () { persistBoard(); }, 260);
  }

  /* ------------------------------ 新建 / 派生 / 删除 ------------------------------ */
  async function postNode(payload) {
    if (DEMO) {
      state.demoSeq += 1;
      var demoNode = normalizeNode({
        id: 'demo-' + state.demoSeq,
        label: payload.label,
        type: payload.type,
        x: payload.x,
        y: payload.y,
        model: payload.model,
        task: payload.task,
        content: '',
        status: 'idle'
      });
      state.board.nodes.push(demoNode);
      if (payload.from) state.board.edges.push({ from: payload.from, to: demoNode.id });
      if (payload.to) state.board.edges.push({ from: demoNode.id, to: payload.to });
      renderBoard();
      selectNode(demoNode.id);
      toast('demo 模式：改动只在当前页面，不落盘', 'warn');
      return demoNode;
    }
    var created = await api('/api/nodes', { method: 'POST', body: payload });
    var raw = created && created.node ? created.node : created;
    var node = normalizeNode(raw);
    if (!node) throw new Error('服务端没有返回新节点');
    if (!getNode(node.id)) state.board.nodes.push(node);
    if (payload.from) {
      var exists = state.board.edges.some(function (e) {
        return e.from === payload.from && e.to === node.id;
      });
      if (!exists) state.board.edges.push({ from: payload.from, to: node.id });
    }
    // 向左派生：新节点是上游，边方向相反
    if (payload.to) {
      var exists2 = state.board.edges.some(function (e) {
        return e.from === node.id && e.to === payload.to;
      });
      if (!exists2) state.board.edges.push({ from: node.id, to: payload.to });
    }
    renderBoard();
    selectNode(node.id);
    return node;
  }

  async function deriveNode(parent, dir) {
    var forward = dir !== 'prev';
    var payload = {
      label: '新卡片',
      type: parent.type || 'llm',
      x: Math.round(forward ? parent.x + CARD_W + 72 : parent.x - CARD_W - 72),
      y: Math.round(parent.y),
      model: parent.model || state.config.models[0] || DEFAULT_MODELS[0],
      task: ''
    };
    // 向右派生：新卡是下游（parent → new）；向左派生：新卡是上游（new → parent）
    if (forward) payload.from = parent.id;
    else payload.to = parent.id;
    try {
      await postNode(payload);
      toast(forward ? '已派生新卡片' : '已添加上游卡片', 'ok');
    } catch (err) {
      toast('新建卡片失败：' + err.message, 'error');
    }
  }

  function createFirstNode() {
    var vp = $('#viewport');
    var rect = vp.getBoundingClientRect();
    var x = Math.round((rect.width / 2 - state.view.x) / state.view.s - CARD_W / 2);
    var y = Math.round((rect.height / 2 - state.view.y) / state.view.s - 90);
    postNode({
      label: '新卡片',
      type: 'llm',
      x: x,
      y: y,
      model: state.config.models[0] || DEFAULT_MODELS[0],
      task: ''
    }).catch(function (err) {
      toast('新建卡片失败：' + err.message, 'error');
    });
  }

  async function deleteNode(id) {
    var node = getNode(id);
    if (!node) return;
    if (!window.confirm('删除卡片「' + (node.label || id) + '」？')) return;

    if (DEMO) {
      state.board.nodes = state.board.nodes.filter(function (n) { return n.id !== id; });
      state.board.edges = state.board.edges.filter(function (e) {
        return e.from !== id && e.to !== id;
      });
      // 选中项被删掉时连面板一起收起（selectNode(null) 会负责隐藏）
      if (state.selectedId === id) selectNode(null);
      renderBoard();
      toast('已删除（demo 本地）', 'ok');
      return;
    }

    try {
      await api('/api/nodes/' + encodeURIComponent(id), { method: 'DELETE' });
      state.board.nodes = state.board.nodes.filter(function (n) { return n.id !== id; });
      state.board.edges = state.board.edges.filter(function (e) {
        return e.from !== id && e.to !== id;
      });
      // 选中项被删掉时连面板一起收起（selectNode(null) 会负责隐藏）
      if (state.selectedId === id) selectNode(null);
      renderBoard();
      toast('已删除卡片', 'ok');
    } catch (err) {
      toast('删除失败：' + err.message, 'error');
    }
  }

  /* ------------------------------ 运行与 SSE ------------------------------ */
  function updateRunUI() {
    var btn = $('#btnRun');
    if (btn) {
      btn.disabled = state.running;
      btn.textContent = state.running ? '运行中…' : '▶ 跑全图';
    }
    var rerun = $('#btnRerun');
    var del = $('#btnDelete');
    if (rerun) rerun.disabled = state.running;
    if (del) del.disabled = state.running;
  }

  function updateNodeUI(node) {
    if (!node) return;
    var card = state.cards.get(node.id);
    if (card) updateCard(node, card);
    if (state.selectedId === node.id) {
      var st = $('#panelStatus');
      if (st) {
        st.textContent = STATUS_TEXT[node.status] || '空闲';
        st.dataset.status = node.status || 'idle';
      }
      var pid = $('#panelId');
      if (pid) pid.textContent = '#' + node.id;
      syncReviewActions(node);
    }
  }

  // 处理一条运行事件；返回 false 表示事件流可以停了
  function handleRunEvent(ev) {
    if (!ev || typeof ev !== 'object') return true;
    var node = ev.id !== null && ev.id !== undefined ? getNode(String(ev.id)) : null;

    switch (ev.type) {
      case 'node:start':
        if (node) {
          node.status = 'running';
          node.error = '';
          node.usage = {};
          node.usedModel = '';
          node.verdict = null; // 重跑时先藏起上一轮的判定结果
          updateNodeUI(node);
          drawEdges();
        }
        break;

      case 'node:done':
        if (node) {
          // 人工确认模式：引擎发的是 node:done + status:'review'，不能当成普通完成
          node.status = ev.status === 'review' ? 'review' : 'done';
          if (typeof ev.content === 'string') node.content = ev.content;
          node.usedModel = ev.model || node.model;
          node.usage = ev.usage && typeof ev.usage === 'object' ? ev.usage : {};
          node.error = '';
          if (ev.verdict) node.verdict = normalizeVerdict(ev.verdict);
          else if (node.status === 'review') node.verdict = null;
          updateNodeUI(node);
          drawEdges();
          if (node.status === 'review') {
            toast('「' + (node.label || node.id) + '」等待人工确认', 'warn');
          }
        }
        break;

      case 'node:review':
        // 待人工确认：卡片橙色角标 + 面板出现「通过 / 打回」
        if (node) {
          node.status = 'review';
          node.error = '';
          if (ev.verdict) node.verdict = normalizeVerdict(ev.verdict);
          updateNodeUI(node);
          drawEdges();
          toast('「' + (node.label || node.id) + '」等待人工确认', 'warn');
        }
        break;

      case 'node:retry':
        if (node) {
          node.error = (ev.model || '模型') + ' 调用失败：' + (ev.error || '未知错误');
          updateNodeUI(node);
          toast('「' + (node.label || node.id) + '」' + (ev.model || '') +
            ' 调用失败，尝试备用模型…', 'warn');
        }
        break;

      case 'node:failed':
        if (node) {
          node.status = 'failed';
          var tried = Array.isArray(ev.tried) ? ev.tried : [];
          node.error = tried.length
            ? '全部模型失败：' + tried.map(function (t) {
              return (t.model || '?') + '（' + (t.error || '?') + '）';
            }).join('；')
            : '节点执行失败';
          updateNodeUI(node);
          drawEdges();
        }
        break;

      case 'node:blocked':
        if (node) {
          node.status = 'blocked';
          node.error = '被阻塞：' + (ev.reason === 'upstream-failed' ? '上游节点失败' : (ev.reason || '未知原因'));
          updateNodeUI(node);
          drawEdges();
        }
        break;

      case 'run:error':
        // 后端跑图中途抛错（不是节点失败，而是整轮运行失败）
        state.running = false;
        state.runEnded = true;
        updateRunUI();
        toast('运行出错：' + (ev.error || '未知错误'), 'error');
        return false;

      case 'run:end':
        state.running = false;
        state.runEnded = true;
        updateRunUI();
        var summary = ev.summary || {};
        var doneN = Array.isArray(summary.done) ? summary.done.length : 0;
        var failN = Array.isArray(summary.failed) ? summary.failed.length : 0;
        var blockN = Array.isArray(summary.blocked) ? summary.blocked.length : 0;
        var reviewN = Array.isArray(summary.review) ? summary.review.length : 0;
        toast('运行结束：成功 ' + doneN + ' · 失败 ' + failN + ' · 阻塞 ' + blockN +
          (reviewN ? ' · 待确认 ' + reviewN : ''),
          failN || blockN ? 'warn' : 'ok');
        // 物料变长后卡片会变高，运行结束后统一整理一次位置，避免互相盖住
        setTimeout(resolveOverlaps, 60);
        return false;

      default:
        break;
    }
    return true;
  }

  // 读取 POST 响应体里的 SSE 流（EventSource 只能 GET，POST 只能走 fetch 流）
  async function readSSE(res, handle) {
    if (!res.body) throw new Error('当前浏览器不支持流式响应读取');
    var reader = res.body.getReader();
    var decoder = new TextDecoder('utf-8');
    var buffer = '';
    var finished = false;
    try {
      while (!finished) {
        var chunk = await reader.read();
        if (chunk.done) break;
        buffer += decoder.decode(chunk.value, { stream: true });
        buffer = buffer.replace(/\r\n/g, '\n');
        var cut;
        while ((cut = buffer.indexOf('\n\n')) !== -1) {
          var frame = buffer.slice(0, cut);
          buffer = buffer.slice(cut + 2);
          var payload = frame.split('\n')
            .filter(function (line) { return line.indexOf('data:') === 0; })
            .map(function (line) { return line.slice(5).replace(/^ /, ''); })
            .join('\n')
            .trim();
          if (!payload) continue;
          var ev;
          try { ev = JSON.parse(payload); } catch (err) { continue; }
          if (handle(ev) === false) { finished = true; break; }
        }
      }
    } finally {
      try { await reader.cancel(); } catch (err) { /* 忽略 */ }
    }
  }

  // 兼容「POST 先返回 JSON，再用 GET 事件流」的后端
  function listenSSE(url, handle) {
    return new Promise(function (resolve, reject) {
      var source;
      try {
        source = new EventSource(url);
      } catch (err) {
        reject(err);
        return;
      }
      var settled = false;
      var finish = function (err) {
        if (settled) return;
        settled = true;
        source.close();
        if (err) reject(err); else resolve();
      };
      source.onmessage = function (event) {
        var data;
        try { data = JSON.parse(event.data); } catch (err) { return; }
        if (handle(data) === false) finish();
      };
      source.onerror = function () {
        finish(new Error('SSE 事件流连接失败或中断'));
      };
    });
  }

  async function demoRun(targets) {
    var ids = targets && targets.length
      ? targets.slice()
      : state.board.nodes.map(function (n) { return n.id; });
    for (var i = 0; i < ids.length; i++) {
      var id = ids[i];
      var node = getNode(id);
      if (!node) continue;
      node.status = 'running';
      node.error = '';
      node.usage = {};
      node.usedModel = '';
      updateNodeUI(node);
      drawEdges();
      await sleep(700);
      var live = getNode(id);
      if (!live || live.status !== 'running') continue;
      if (!live.content) live.content = '【演示输出】' + (live.task || '这是一段生成的物料') + '。';
      live.status = 'done';
      live.usedModel = live.model || 'demo-model';
      live.usage = {
        total_tokens: 600 + Math.round(Math.random() * 1200),
        ms: 700 + Math.round(Math.random() * 1500)
      };
      updateNodeUI(live);
      drawEdges();
      await sleep(250);
    }
    resolveOverlaps();
    toast('演示运行结束', 'ok');
  }

  async function startRun(targets) {
    if (state.running) {
      toast('已经有一轮在跑了，稍等一下～', 'warn');
      return;
    }
    if (!state.board.nodes.length) {
      toast('画布是空的，先新建一个节点吧', 'warn');
      return;
    }

    // 先把用户刚改的字段提交掉，避免运行读到旧内容
    try { await flushAllPatches(); } catch (err) { /* flushPatch 内部已提示 */ }

    state.running = true;
    state.runEnded = false;
    updateRunUI();

    // 目标节点先清成 idle，等待 SSE 事件驱动状态
    var targetIds = targets && targets.length
      ? targets.slice()
      : state.board.nodes.map(function (n) { return n.id; });
    targetIds.forEach(function (id) {
      var node = getNode(id);
      if (!node) return;
      node.status = 'idle';
      node.error = '';
      node.usage = {};
      node.usedModel = '';
      node.verdict = null;
      updateNodeUI(node);
    });
    drawEdges();

    if (DEMO) {
      try {
        await demoRun(targets);
        state.runEnded = true;
      } catch (err) {
        toast('演示运行失败：' + err.message, 'error');
      } finally {
        state.running = false;
        updateRunUI();
      }
      return;
    }

    try {
      var res = await fetch('/api/run', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify(targets && targets.length ? { targets: targets } : {})
      });
      if (!res.ok) {
        var detail = '';
        try { detail = (await res.text()).slice(0, 240); } catch (err) { detail = ''; }
        throw new Error('POST /api/run → ' + res.status + (detail ? ' · ' + detail : ''));
      }
      var ct = (res.headers.get('content-type') || '').toLowerCase();
      if (ct.indexOf('text/event-stream') !== -1) {
        await readSSE(res, handleRunEvent);
      } else {
        var info = await res.json().catch(function () { return {}; });
        var streamUrl = (info && (info.events || info.stream)) || '/api/events';
        await listenSSE(streamUrl, handleRunEvent);
      }
      // 正常情况流以 run:end 收尾；没收到就在界面上提示，不静默
      if (!state.runEnded) {
        toast('事件流提前结束，部分卡片状态可能不准，刷新页面可确认结果', 'warn');
      }
    } catch (err) {
      toast('运行失败：' + err.message, 'error');
      // 收到了 HTTP 响应（比如 409 已有一轮在跑）说明服务还活着，只是拒绝执行；
      // 网络断开才算连接失败。两种情况都在界面上可见。
      var httpError = /POST \/api\/run → \d+/.test(err.message);
      if (httpError) {
        setConn(true, '已连接');
        // 服务端拒绝时，用服务端数据把状态恢复回来
        setTimeout(function () { if (!state.running) loadBoard(); }, 300);
      } else {
        setConn(false, err.message);
        // 事件流中断时，别让卡片永远转圈
        state.board.nodes.forEach(function (node) {
          if (node.status === 'running') {
            node.status = 'failed';
            node.error = '事件流中断：' + err.message;
            updateNodeUI(node);
          }
        });
      }
      drawEdges();
    } finally {
      state.running = false;
      updateRunUI();
    }
  }

  /* ------------------------------ 设置弹窗 ------------------------------ */
  // 实际后端的 provider 行：model / baseURL / apiKey 各一个输入框

    var baseField = make('label', { class: 'field' }, [

    ]);
    var keyField = make('label', { class: 'field full' }, [

      make('input', {
        class: 'p-key', type: 'password',
        placeholder: '留空则保持不变', autocomplete: 'off'
      })
    ]);
    fields.append(modelField, baseField, keyField);
    row.append(head, fields);
    return row;
  }

  function openSettings() {
    var mockBox = $('#cfgMock');
    if (mockBox) mockBox.checked = !!state.config.mock;

    var providerBlock = $('#providerBlock');
    var simpleBlock = $('#simpleBlock');
    var rowsBox = $('#providerRows');
    var providers = state.config.providers;
    var useProviders = !!(providers && Object.keys(providers).length);

    if (rowsBox) rowsBox.innerHTML = '';
    if (useProviders) {
      providerBlock.classList.remove('hidden');
      simpleBlock.classList.add('hidden');
      Object.keys(providers).forEach(function (name) {
        rowsBox.appendChild(makeProviderRow(name, providers[name]));
      });
    } else {
      providerBlock.classList.add('hidden');
      simpleBlock.classList.remove('hidden');
      $('#cfgBase').value = state.config.baseURL || '';
      $('#cfgKey').value = '';
      $('#cfgModels').value = (state.config.models.length ? state.config.models : DEFAULT_MODELS).join('\n');
    }

    var hint = $('#cfgMockHint');
    if (hint) {
      hint.textContent = state.config.mock
        ? '当前后端为 mock 模式（不会发真实请求）'
        : '当前后端为 real 模式（会调用真实模型）';
    }
    // MCP 列表：先按本地状态渲染，再后台刷新一次；接口没就绪只降级显示，不阻塞弹窗
    renderMcpList();
    loadMcp({ notify: false, retry: false });
    $('#modal').classList.remove('hidden');
    setTimeout(function () {
      var first = useProviders ? rowsBox.querySelector('input') : $('#cfgBase');
      if (first) first.focus();
    }, 30);
  }

  function closeSettings() {
    $('#modal').classList.add('hidden');
  }

  async function saveSettings() {
    var mock = !!($('#cfgMock') && $('#cfgMock').checked);
    var useProviders = !!(state.config.providers && Object.keys(state.config.providers).length);
    var payload;

    if (useProviders) {
      // 实际后端：{ mock, providers: { name: { model, baseURL, apiKey? } } }
      payload = { mock: mock, providers: {} };
      var rows = document.querySelectorAll('#providerRows .provider-row');
      Array.prototype.forEach.call(rows, function (row) {
        var name = row.getAttribute('data-name');
        var model = row.querySelector('.p-model').value.trim();
        var baseURL = row.querySelector('.p-base').value.trim();
        var apiKey = row.querySelector('.p-key').value.trim();
        var inc = { model: model, baseURL: baseURL };
        if (apiKey) inc.apiKey = apiKey; // 留空表示不修改已保存的 key
        payload.providers[name] = inc;
      });
    } else {
      // 契约形态：{ baseURL, models, apiKey?, mock }
      var baseURL = ($('#cfgBase').value || '').trim();
      var apiKey = ($('#cfgKey').value || '').trim();
      var models = ($('#cfgModels').value || '')
        .split(/[\s,，]+/)
        .map(function (s) { return s.trim(); })
        .filter(Boolean);
      payload = { baseURL: baseURL, models: models, mock: mock };
      if (apiKey) payload.apiKey = apiKey;
    }

    // mcpServers 和 providers 存在同一份配置里：把本地已知的带回去，避免保存时被覆盖
    if (state.mcpSpecs && Object.keys(state.mcpSpecs).length) {
      payload.mcpServers = state.mcpSpecs;
    }

    var btn = $('#btnSaveCfg');
    btn.disabled = true;
    btn.textContent = '保存中…';
    try {
      if (DEMO) {
        state.config.mock = mock;
        if (!useProviders) {
          state.config.baseURL = payload.baseURL;
          state.config.models = payload.models;
        }
        toast('demo 模式：配置只保存在当前页面', 'warn');
      } else {
        await api('/api/config', { method: 'PUT', body: payload });
        await loadConfig(); // 重新拉一次，保证 badge 和表单与后端一致
        toast('配置已保存', 'ok');
      }
      renderModeBadge();
      if (state.selectedId) {
        var node = getNode(state.selectedId);
        if (node) syncPanel(node);
      }
      closeSettings();
    } catch (err) {
      toast('保存配置失败：' + err.message, 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = '保存';
    }
  }

  /* ------------------------------ 事件绑定 ------------------------------ */
  function bindUI() {
    // 设置弹窗放在 form 里（密码输入需要 form 上下文），阻止回车提交刷新页面
    var settingsForm = $('#settingsForm');
    if (settingsForm) {
      settingsForm.addEventListener('submit', function (e) { e.preventDefault(); });
    }

    $('#btnRun').addEventListener('click', function () { startRun(); });
    $('#btnSettings').addEventListener('click', openSettings);
    $('#btnModalClose').addEventListener('click', closeSettings);
    $('#btnCancelCfg').addEventListener('click', closeSettings);
    $('#btnSaveCfg').addEventListener('click', saveSettings);
    $('#btnFirstNode').addEventListener('click', createFirstNode);
    $('#btnRetry').addEventListener('click', function () {
      loadConfig();
      loadBoard();
    });
    $('#btnPanelClose').addEventListener('click', function () { selectNode(null); });
    $('#btnRerun').addEventListener('click', function () {
      if (state.selectedId) startRun([state.selectedId]);
    });
    $('#btnDelete').addEventListener('click', function () {
      if (state.selectedId) deleteNode(state.selectedId);
    });

    // 面板字段编辑
    $('#fLabel').addEventListener('input', function (e) {
      var node = getNode(state.selectedId);
      if (!node) return;
      node.label = e.target.value;
      updateNodeUI(node);
      queuePatch(node.id, { label: node.label });
    });
    $('#fModel').addEventListener('change', function (e) {
      var node = getNode(state.selectedId);
      if (!node) return;
      node.model = e.target.value;
      updateNodeUI(node);
      queuePatch(node.id, { model: node.model });
    });
    $('#fTask').addEventListener('input', function (e) {
      var node = getNode(state.selectedId);
      if (!node) return;
      node.task = e.target.value;
      queuePatch(node.id, { task: node.task });
    });
    $('#fCriteria').addEventListener('input', function (e) {
      var node = getNode(state.selectedId);
      if (!node) return;
      node.criteria = e.target.value;
      queuePatch(node.id, { criteria: node.criteria });
    });

    // 改上游：重建所有 to == 本节点的边（from 方向不动）
    $('#fUp').addEventListener('change', function () {
      var id = state.selectedId;
      if (!id) return;
      var sel = $('#fUp');
      var picked = [];
      for (var i = 0; i < sel.options.length; i++) {
        if (sel.options[i].selected) picked.push(sel.options[i].value);
      }
      state.board.edges = state.board.edges.filter(function (e) { return e.to !== id; });
      picked.forEach(function (p) { state.board.edges.push({ from: p, to: id }); });
      drawEdges();
      persistBoardSoon();
      toast(picked.length ? '上游已更新：' + picked.length + ' 个' : '上游已清空', 'ok');
    });

    // 技能 / 工具：复选框，勾选即挂载（事件委托，列表重建后不用重绑）
    $('#skillList').addEventListener('change', onSkillsChange);
    $('#toolList').addEventListener('change', onToolsChange);

    // 结果判断：单选变更立即 PATCH
    $('#verifyOptions').addEventListener('change', onVerifyChange);

    // 待人工确认：通过 / 打回重跑
    $('#btnVerifyPass').addEventListener('click', function () { submitVerify(true); });
    $('#btnVerifyFail').addEventListener('click', function () { submitVerify(false); });

    // 接口没就绪时，提示文字本身可以点着重试
    $('#skillsHint').addEventListener('click', function () {
      if (state.skillsStatus === 'error') loadSkills({ notify: true, retry: true });
    });
    $('#toolsHint').addEventListener('click', function () {
      if (state.mcpStatus === 'error') loadMcp({ notify: true, retry: true });
    });

    // 设置弹窗里的 MCP：刷新列表 / 添加 stdio server
    $('#btnMcpRefresh').addEventListener('click', function () {
      if (state.mcpStatus !== 'loading') loadMcp({ notify: true, retry: true });
    });
    $('#btnMcpAdd').addEventListener('click', addMcpServer);

    // 点弹窗遮罩关闭
    $('#modal').addEventListener('click', function (e) {
      if (e.target === $('#modal')) closeSettings();
    });

    // 缩放按钮
    $('#zoomIn').addEventListener('click', function () { setZoom(state.view.s * 1.2); });
    $('#zoomOut').addEventListener('click', function () { setZoom(state.view.s / 1.2); });
    $('#zoomReset').addEventListener('click', resetView);

    // Esc：先关弹窗，再取消选中
    document.addEventListener('keydown', function (e) {
      if (e.key !== 'Escape') return;
      if (!$('#modal').classList.contains('hidden')) {
        closeSettings();
      } else if (state.selectedId) {
        selectNode(null);
      }
    });

    bindViewport();
  }

  /* ------------------------------ 启动 ------------------------------ */
  async function boot() {
    bindUI();
    applyView();
    updateRunUI();
    if (DEMO) setConn(true, '演示模式');
    await loadConfig();
    await loadBoard();
    // 技能 / MCP 是增强信息：异步加载，接口没就绪也不能拖垮画布
    if (DEMO) {
      state.skillsStatus = 'ok';
      state.mcpStatus = 'ok';
      syncPanelMulti();
    } else {
      loadSkills({ notify: true, retry: true });
      loadMcp({ notify: true, retry: true });
    }
    drawEdges();
  }

  boot();
})();
</script>
</body>
</html>
